<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH03NIX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<style>
  body { margin:0; font-family: Arial, sans-serif; background:#0a0e1a; color:#fff; height:100vh; display:flex; flex-direction:column; }
  .header { background:#111827; padding:12px; text-align:center; border-bottom:2px solid #00d4ff; }
  .header h1 { margin:0; color:#00d4ff; letter-spacing:4px; font-size:24px; }
  .header p { margin:3px 0 0; color:#9ca3af; font-size:11px; }

  .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }

  .avatar { width:200px; height:200px; border-radius:50%; background: radial-gradient(circle, #0a0e1a 40%, #00d4ff 41%, #0a0e1a 60%); display:flex; align-items:center; justify-content:center; border:3px solid #00d4ff; box-shadow:0 0 50px #00d4ff66; margin-bottom:20px; }
  .avatar .core { width:80px; height:80px; border-radius:50%; background:#00d4ff; box-shadow:0 0 30px #00d4ff; transition:0.3s; }
  .avatar.sleeping .core { background:#1f2937; box-shadow:none; }
  .avatar.listening .core { animation: pulse 1s infinite; }
  .avatar.thinking .core { animation: spin 1s linear infinite; }
  .avatar.speaking .core { animation: wave 0.5s infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.25); } }
  @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
  @keyframes wave { 0%,100% { transform:scaleY(1); } 50% { transform:scaleY(1.35); } }

  #status { text-align:center; color:#00d4ff; font-size:16px; margin-bottom:10px; min-height:24px; }
  #lastHeard { text-align:center; color:#9ca3af; font-size:13px; margin-bottom:20px; min-height:20px; padding:0 20px; }

  .controls { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding:15px; }
  button { padding:16px 22px; background:#00d4ff; border:none; border-radius:12px; font-weight:bold; color:#000; font-size:15px; }
  #wakeBtn { background:#00ff88; }
  #micBtn { background:#fff; }
  #stopBtn { background:#ff4444; color:#fff; display:none; }

  #chat { max-height:20vh; overflow-y:auto; padding:10px; width:100%; box-sizing:border-box; }
  .msg { max-width:85%; padding:8px 12px; border-radius:12px; line-height:1.4; font-size:13px; margin-bottom:6px; }
  .user { margin-left:auto; background:#00d4ff; color:#000; }
  .phoenix { margin-right:auto; background:#1f2937; border:1px solid #00d4ff; }

  #previewBox { display:none; margin:10px; padding:12px; background:#fff; color:#000; border-radius:12px; width:90%; }
</style>
</head>
<body>
<div class="header">
  <h1>PH03NIX</h1>
  <p>Phase 5: Voice Only - Speaking To Speaking</p>
</div>

<div class="main">
  <div id="avatar" class="avatar sleeping">
    <div class="core"></div>
  </div>
  <div id="status">Tap Wake Word and talk to me, Master</div>
  <div id="lastHeard"></div>

  <div class="controls">
    <button id="wakeBtn" onclick="toggleWakeWord()">👂 Wake Word</button>
    <button id="micBtn" onclick="startListening()">🎤 Talk</button>
    <button id="stopBtn" onclick="stopAll()">⏹ Stop</button>
  </div>
</div>

<div id="previewBox">
  <h3 style="margin:0 0 8px;">PH03NIX Builder - Live Preview</h3>
  <div id="previewContent"></div>
  <button onclick="document.getElementById('previewBox').style.display='none'" style="margin-top:10px;">Close</button>
</div>

<div id="chat"></div>

<script>
// ===== PH03NIX - PHASE 5 - VOICE ONLY =====
const avatar = document.getElementById('avatar');
const status = document.getElementById('status');
const lastHeard = document.getElementById('lastHeard');
const chat = document.getElementById('chat');
const previewBox = document.getElementById('previewBox');
const previewContent = document.getElementById('previewContent');
const stopBtn = document.getElementById('stopBtn');

let memory = JSON.parse(localStorage.getItem('phoenix_memory') || '{"notes":[],"today":[]}');
let currentMode = 'general';
function saveMemory() { localStorage.setItem('phoenix_memory', JSON.stringify(memory)); }

function setAvatar(state, text) {
  avatar.className = 'avatar ' + state;
  status.textContent = text;
}

function addMsg(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  if (sender === 'user') {
    memory.today.push(text);
    saveMemory();
  }
}

function speak(text) {
  setAvatar('speaking', 'Speaking...');
  lastHeard.textContent = "";
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 0.9;
  const voices = speechSynthesis.getVoices();
  const maleVoice = voices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('guy'));
  if (maleVoice) utterance.voice = maleVoice;
  utterance.onend = () => {
    if (!wakeActive) setAvatar('sleeping', 'Tap Wake Word or Talk');
    else setAvatar('listening', 'Listening for "HEY PH03NIX"...');
  };
  speechSynthesis.speak(utterance);
}

function stopAll() {
  speechSynthesis.cancel();
  if (wakeRecognition) wakeRecognition.stop();
  if (currentRecognition) currentRecognition.stop();
  wakeActive = false;
  stopBtn.style.display = 'none';
  setAvatar('sleeping', 'Stopped. Tap Wake Word or Talk');
}

let currentRecognition = null;
function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { speak("Master, please use Chrome for voice."); return; }
  currentRecognition = new SpeechRecognition();
  currentRecognition.lang = 'en-US';
  setAvatar('listening', 'Listening... Speak now, Master');
  stopBtn.style.display = 'inline-block';
  currentRecognition.start();
  currentRecognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    lastHeard.textContent = "You said: " + transcript;
    handleVoiceCommand(transcript);
  };
  currentRecognition.onerror = () => {
    setAvatar('sleeping', 'I did not hear you. Tap Talk again.');
    stopBtn.style.display = 'none';
  };
  currentRecognition.onend = () => {
    if (avatar.className.includes('listening') && !wakeActive) {
      setAvatar('sleeping', 'Tap Wake Word or Talk');
      stopBtn.style.display = 'none';
    }
  };
}

let wakeActive = false;
let wakeRecognition = null;
function toggleWakeWord() {
  if (wakeActive) {
    wakeActive = false;
    if (wakeRecognition) wakeRecognition.stop();
    stopBtn.style.display = 'none';
    setAvatar('sleeping', 'Wake Word OFF');
    speak("Wake Word OFF, Master.");
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { speak("Master, use Chrome for Wake Word."); return; }
  wakeActive = true;
  stopBtn.style.display = 'inline-block';
  wakeRecognition = new SpeechRecognition();
  wakeRecognition.lang = 'en-US';
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  setAvatar('listening', 'Listening for "HEY PH03NIX"...');
  speak("Wake Word ON, Master. Say Hey PH03NIX.");
  wakeRecognition.onresult = (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
    if (transcript.includes('hey phoenix')) {
      lastHeard.textContent = "Wake Word Detected";
      const reply = "Yes, Master. How can I assist you?";
      addMsg("HEY PH03NIX", 'user');
      addMsg(reply, 'phoenix');
      speak(reply);
      // Listen for command
      const cmd = new SpeechRecognition();
      cmd.lang = 'en-US';
      cmd.start();
      cmd.onresult = (e) => {
        const command = e.results[0][0].transcript;
        lastHeard.textContent = "You said: " + command;
        handleVoiceCommand(command);
      };
    }
  };
  wakeRecognition.onerror = () => { if (wakeActive) setTimeout(() => { try{wakeRecognition.start()}catch(e){} }, 1000); };
  wakeRecognition.onend = () => { if (wakeActive) setTimeout(() => { try{wakeRecognition.start()}catch(e){} }, 500); };
  wakeRecognition.start();
}

function openApp(appName) {
  const apps = {
    whatsapp: "https://wa.me/",
    instagram: "https://instagram.com/",
    snapchat: "https://snapchat.com/",
    chrome: "https://google.com/",
    google: "https://google.com/",
    email: "https://mail.google.com/",
    spotify: "https://open.spotify.com/",
    audiomack: "https://audiomack.com/",
    files: "https://drive.google.com/",
    photos: "https://photos.google.com/",
    settings: "intent://#Intent;action=android.settings.SETTINGS;end",
    alarm: "intent://#Intent;action=android.intent.action.SET_ALARM;end",
    clock: "intent://#Intent;action=android.intent.action.SHOW_ALARMS;end",
    minimilitia: "intent://#Intent;package=com.appsomniacs.da2;end"
  };
  const link = apps[appName.toLowerCase()];
  if (link) {
    setTimeout(() => { window.location.href = link; }, 1500);
    return "Opening " + appName + " for you, Master.";
  }
  return "Master, I don't have " + appName + " in my list.";
}

function buildWebsite(topic) {
  const html = `<div style="font-family:Arial; text-align:center; padding:20px; background:#0a0e1a; color:#fff; border-radius:12px;">
    <h1 style="color:#00d4ff;">${topic}</h1>
    <p>Welcome to ${topic}. Built by PH03NIX for Master.</p>
    <button style="background:#00d4ff; color:#000; padding:12px 20px; border:none; border-radius:8px; font-weight:bold;">Get Started</button>
  </div>`;
  previewContent.innerHTML = html;
  previewBox.style.display = 'block';
  return "Done, Master. I have built a website for " + topic + ". Check the preview above.";
}

function handleVoiceCommand(userText) {
  const t = userText.toLowerCase().trim();
  addMsg(userText, 'user');
  setAvatar('thinking', 'Thinking...');

  setTimeout(() => {
    let reply = "";

    if (t.startsWith('remember this')) {
      const note = userText.replace(/remember this[:\-]?/i, '').trim();
      memory.notes.push(note);
      saveMemory();
      reply = 'Noted, Master. I have remembered: ' + note + '.';
    } else if (t.includes('what do you remember')) {
      reply = memory.notes.length ? "Master, I remember: " + memory.notes.join(", ") : "Master, my memory is empty. Say 'remember this' to teach me.";
    } else if (t.includes('what did we do today')) {
      reply = memory.today.length ? "Master, today we did: " + memory.today.slice(-5).join(", ") : "Master, we have not done much today yet.";
    } else if (t.startsWith('open ')) {
      const app = t.replace('open ', '').trim();
      reply = openApp(app);
    } else if (t.includes('build me a website') || t.includes('build a website')) {
      const topic = userText.replace(/build me a website for|build a website for|build me a website|build a website/gi, '').trim() || "My Business";
      reply = buildWebsite(topic);
    } else if (t.includes('coding mode')) {
      currentMode = 'coding';
      reply = "Coding Mode activated, Master. Tell me your code or error.";
    } else if (t.includes('school mode')) {
      currentMode = 'school';
      reply = "School Mode activated, Master. Tell me your subject and topic.";
    } else if (t.includes('business mode')) {
      currentMode = 'business';
      reply = "Business Mode activated, Master. Tell me what you are selling.";
    } else if (t.includes('code') || t.includes('html') || t.includes('javascript')) {
      reply = "Coding Mode, Master. Tell me your code or error and I will explain it in simple English.";
    } else if (t.includes('school') || t.includes('jamb') || t.includes('exam')) {
      reply = "School Mode, Master. Tell me your subject and topic. I will explain step by step.";
    } else if (t.includes('business') || t.includes('sell') || t.includes('price')) {
      reply = "Business Mode, Master. Tell me what you are selling and I will help with pricing and marketing.";
    } else if (t.includes('hello') || t.includes('hi') || t.includes('hey')) {
      reply = "Yes, Master. How can I assist you?";
    } else if (t.includes('stop') || t.includes('go to sleep')) {
      reply = "Going to sleep, Master. Say 'HEY PH03NIX' to wake me.";
      addMsg(reply, 'phoenix');
      speak(reply);
      stopAll();
      return;
    } else {
      reply = "I understand, Master. I can open apps, remember things, build websites, help with coding, school and business. Just talk to me. For example, say 'open whatsapp' or 'build me a website'.";
    }

    addMsg(reply, 'phoenix');
    speak(reply);
  }, 800);
}

addMsg("Yes, Master. I am PH03NIX. Phase 5 is online. Voice only. Tap Wake Word and say HEY PH03NIX.", 'phoenix');
setTimeout(() => speak("Yes, Master. I am PH03NIX. Phase 5 is online. Voice only. Tap Wake Word and talk to me."), 1000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
