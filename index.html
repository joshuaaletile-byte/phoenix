<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PH03NIX</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050A14">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh; overflow:hidden; font-family: 'Segoe UI', Arial, sans-serif;
    background: #050A14;
    background-image: radial-gradient(circle at 50% 40%, rgba(0,212,255,0.12) 0%, transparent 55%);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding: 40px 20px 45px;
  }

  /* Top - Name only */
  .logo {
    font-size:32px; font-weight:800; letter-spacing:10px; text-align:center;
    color:#fff; margin-top:15px;
  }
  .logo span { color:#00D4FF; }
  .line { width:50px; height:2px; background:#00D4FF; margin:14px auto 0; border-radius:2px; opacity:0.8; }

  /* Center - Orb with sense */
  .orb-wrap { position:relative; width:260px; height:260px; display:flex; align-items:center; justify-content:center; flex:1; }
  .ring-outer {
    position:absolute; width:240px; height:240px; border-radius:50%;
    border:1px solid rgba(0,212,255,0.25);
  }
  .ring-mid {
    position:absolute; width:200px; height:200px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.12);
  }
  .ring-spin {
    position:absolute; width:220px; height:220px; border-radius:50%;
    border:2px solid transparent; border-top-color:#00D4FF; border-right-color:#00D4FF;
    animation: spin 6s linear infinite; opacity:0.9;
  }
  @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }

  .orb {
    width:145px; height:145px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #B8F1FF 18%, #00D4FF 55%, #003A4D 100%);
    box-shadow: 0 0 35px rgba(0,212,255,0.45), 0 0 80px rgba(0,212,255,0.18), inset 0 0 25px rgba(255,255,255,0.5);
    transition:0.3s;
  }
  .orb.sleeping { filter:brightness(0.55); box-shadow:0 0 15px rgba(0,212,255,0.15); }
  .orb.listening { animation: breathe 1.8s ease-in-out infinite; }
  .orb.thinking { animation: spin 1s linear infinite; }
  .orb.speaking { animation: speakPulse 0.45s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
  @keyframes speakPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.10); } }

  /* Mouth - clean white bars */
  .mouth { display:flex; gap:5px; align-items:center; height:36px; }
  .bar { width:4px; background:#fff; border-radius:10px; height:6px; transition:0.2s; }
  .orb.sleeping .bar { height:4px; opacity:0.5; }
  .orb.listening .bar { animation: wave 1.1s ease-in-out infinite; }
  .orb.speaking .bar { animation: waveFast 0.4s ease-in-out infinite; }
  .orb.thinking .bar { animation: wave 0.9s ease-in-out infinite; }
  .bar:nth-child(1){ animation-delay:0s; } .bar:nth-child(2){ animation-delay:0.1s; } .bar:nth-child(3){ animation-delay:0.2s; } .bar:nth-child(4){ animation-delay:0.3s; } .bar:nth-child(5){ animation-delay:0.15s; } .bar:nth-child(6){ animation-delay:0.05s; } .bar:nth-child(7){ animation-delay:0.25s; }
  @keyframes wave { 0%,100% { height:7px; } 50% { height:24px; } }
  @keyframes waveFast { 0%,100% { height:8px; } 50% { height:34px; } }

  /* Bottom - One button only */
  #wakeBtn {
    padding:15px 42px; border-radius:50px; border:1px solid #00D4FF;
    background: transparent; color:#fff; font-size:14px; font-weight:700; letter-spacing:3px; cursor:pointer;
  }
  #wakeBtn.active { background:#00D4FF; color:#050A14; box-shadow:0 0 25px rgba(0,212,255,0.5); }

  #previewBox { display:none; position:fixed; top:12px; left:12px; right:12px; bottom:12px; background:#fff; color:#000; border-radius:18px; padding:15px; overflow:auto; z-index:100; }
</style>
</head>
<body>

  <div>
    <div class="logo">PH<span>0</span>3NIX</div>
    <div class="line"></div>
  </div>

  <div class="orb-wrap">
    <div class="ring-outer"></div>
    <div class="ring-mid"></div>
    <div class="ring-spin"></div>
    <div id="orb" class="orb sleeping">
      <div class="mouth">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>
  </div>

  <button id="wakeBtn" onclick="toggleWakeWord()">ACTIVATE</button>

  <div id="previewBox">
    <div id="previewContent"></div>
    <button onclick="document.getElementById('previewBox').style.display='none'" style="margin-top:10px;padding:10px 20px;border:none;background:#050A14;color:#fff;border-radius:10px;">Close</button>
  </div>

<script>
const orb = document.getElementById('orb');
const wakeBtn = document.getElementById('wakeBtn');
const previewBox = document.getElementById('previewBox');
const previewContent = document.getElementById('previewContent');

let memory = JSON.parse(localStorage.getItem('phoenix_memory') || '{"notes":[],"today":[]}');
function saveMemory(){ localStorage.setItem('phoenix_memory', JSON.stringify(memory)); }
function setOrb(state){ orb.className = 'orb ' + state; }

function speak(text){
  setOrb('speaking');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  u.pitch = 0.65;
  u.volume = 1;
  const voices = speechSynthesis.getVoices();
  let male = voices.find(v => v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('guy') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('ryan'));
  if(!male) male = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male'));
  if(!male) male = voices.find(v => v.lang === 'en-US' || v.lang === 'en-GB');
  if(male) u.voice = male;
  u.onend = () => { if(wakeActive) setOrb('listening'); else setOrb('sleeping'); };
  speechSynthesis.speak(u);
}

let wakeActive = false;
let wakeRecognition = null;

function toggleWakeWord(){
  if(wakeActive){
    wakeActive = false;
    if(wakeRecognition) wakeRecognition.stop();
    speechSynthesis.cancel();
    wakeBtn.textContent = 'ACTIVATE';
    wakeBtn.classList.remove('active');
    setOrb('sleeping');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ speak("Please use Chrome for voice."); return; }
  wakeActive = true;
  wakeBtn.textContent = 'ACTIVE';
  wakeBtn.classList.add('active');
  setOrb('listening');
  wakeRecognition = new SR();
  wakeRecognition.lang = 'en-US';
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  wakeRecognition.start();
  wakeRecognition.onresult = (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
    if(transcript.includes('hey phoenix') || transcript.includes('phoenix')){
      handleCommand(transcript);
    } else if(event.results[event.results.length - 1].isFinal){
      if(transcript.length > 3) handleCommand(transcript);
    }
  };
  wakeRecognition.onerror = () => { if(wakeActive) setTimeout(()=>{ try{wakeRecognition.start()}catch(e){} }, 800); };
  wakeRecognition.onend = () => { if(wakeActive) setTimeout(()=>{ try{wakeRecognition.start()}catch(e){} }, 400); };
}

function openApp(appName){
  const apps = {
    whatsapp: "https://wa.me/",
    instagram: "https://instagram.com/",
    snapchat: "https://snapchat.com/",
    chrome: "https://google.com/",
    google: "https://google.com/",
    email: "https://mail.google.com/",
    spotify: "https://open.spotify.com/",
    audiomack: "https://audiomack.com/",
    files: "https://drive.google.com/",
    photos: "https://photos.google.com/",
    settings: "intent://#Intent;action=android.settings.SETTINGS;end",
    alarm: "intent://#Intent;action=android.intent.action.SET_ALARM;end",
    clock: "intent://#Intent;action=android.intent.action.SHOW_ALARMS;end",
    minimilitia: "intent://#Intent;package=com.appsomniacs.da2;end"
  };
  const link = apps[appName.toLowerCase()];
  if(link){ setTimeout(()=>{ window.location.href = link; }, 1600); return "Opening " + appName + " for you, Master."; }
  return "Master, I don't have " + appName + " in my list.";
}

function buildWebsite(topic){
  const html = `<div style="font-family:Arial;text-align:center;padding:20px;background:#050A14;color:#fff;border-radius:12px;">
    <h1 style="color:#00D4FF;">${topic}</h1><p>Welcome to ${topic}. Built by PH03NIX for Master.</p>
    <button style="background:#00D4FF;color:#050A14;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;">Get Started</button></div>`;
  previewContent.innerHTML = html;
  previewBox.style.display = 'block';
  return "Done, Master. I have built a website for " + topic + ". Check the preview.";
}

function handleCommand(userText){
  const t = userText.toLowerCase().trim();
  const clean = t.replace('hey phoenix','').trim();
  const cmd = clean || t;
  setOrb('thinking');
  memory.today.push(cmd); saveMemory();
  setTimeout(()=>{
    let reply = "";
    if(cmd.startsWith('remember this')){
      const note = cmd.replace('remember this','').trim();
      memory.notes.push(note); saveMemory();
      reply = "Noted, Master. I have remembered that.";
    } else if(cmd.includes('what do you remember')){
      reply = memory.notes.length ? "Master, I remember: " + memory.notes.join(", ") : "Master, my memory is empty.";
    } else if(cmd.includes('what did we do today')){
      reply = memory.today.length ? "Master, today we talked about: " + memory.today.slice(-5).join(", ") : "Master, we have not done much today yet.";
    } else if(cmd.startsWith('open ')){
      reply = openApp(cmd.replace('open ','').trim());
    } else if(cmd.includes('build me a website') || cmd.includes('build a website')){
      const topic = cmd.replace(/build me a website for|build a website for|build me a website|build a website/gi,'').trim() || "My Business";
      reply = buildWebsite(topic);
    } else if(cmd.includes('coding') || cmd.includes('code') || cmd.includes('html')){
      reply = "Coding mode, Master. Tell me your code or error and I will explain it in simple English and help you fix it.";
    } else if(cmd.includes('school') || cmd.includes('jamb') || cmd.includes('exam')){
      reply = "School mode, Master. Tell me your subject and topic. I will explain step by step.";
    } else if(cmd.includes('business') || cmd.includes('sell') || cmd.includes('price')){
      reply = "Business mode, Master. Tell me what you are selling and I will help with pricing and marketing.";
    } else if(cmd.includes('hello') || cmd.includes('hi') || cmd === 'hey phoenix'){
      reply = "Yes, Master. I am here. How can I assist you?";
    } else if(cmd.includes('stop') || cmd.includes('sleep')){
      reply = "Going to sleep, Master.";
      speak(reply);
      setTimeout(()=>{ toggleWakeWord(); }, 1500);
      return;
    } else if(cmd.length < 3){ return; }
    else { reply = "I understand, Master. I can open apps, remember things, build websites, and help with coding, school and business. Just talk to me."; }
    speak(reply);
  }, 600);
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
